[project]
name = "excerpt-player"
version = "0.1.0"
description = "Local app that reads scanned violin excerpts and plays them back"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "homr>=0.7.1",
    "music21>=10.5.2",
    "opencv-python-headless>=4.14.0.94",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
